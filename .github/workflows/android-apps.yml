name: Android apps

# Builds the Android apps: MW Ops for staff (android/ops), Mithai Wallah for customers
# (android/shop), MW Sales for the field sales team (android/sales) and MW Wholesale for sweet
# shops (android/trade). Signed when the signing secrets are set; otherwise the files are unsigned
# and need signing before they can be installed. Two keys:
# - MW Ops and Mithai Wallah: MW_OPS_KEYSTORE_BASE64, MW_OPS_KEYSTORE_PASSWORD, MW_OPS_KEY_ALIAS,
#   MW_OPS_KEY_PASSWORD.
# - MW Sales and MW Wholesale: MW_B2B_KEYSTORE_BASE64, MW_B2B_KEYSTORE_PASSWORD, MW_B2B_KEY_ALIAS,
#   MW_B2B_KEY_PASSWORD.

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "!android/**/*.md"
      - ".github/workflows/android-apps.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: ops
            key: ops
            name: mw-ops
            title: MW Ops
          - project: shop
            key: ops
            name: mithai-wallah
            title: Mithai Wallah
          - project: sales
            key: b2b
            name: mw-sales
            title: MW Sales
          - project: trade
            key: b2b
            name: mw-wholesale
            title: MW Wholesale
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Signing key
        env:
          KEY: ${{ matrix.key }}
          OPS_KEYSTORE_BASE64: ${{ secrets.MW_OPS_KEYSTORE_BASE64 }}
          B2B_KEYSTORE_BASE64: ${{ secrets.MW_B2B_KEYSTORE_BASE64 }}
        run: |
          if [ "$KEY" = "b2b" ]; then KEYSTORE_BASE64="$B2B_KEYSTORE_BASE64"; else KEYSTORE_BASE64="$OPS_KEYSTORE_BASE64"; fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release-key.p12"
            echo "MW_OPS_KEYSTORE=$RUNNER_TEMP/release-key.p12" >> "$GITHUB_ENV"
            echo "SIGNED=signed" >> "$GITHUB_ENV"
          else
            echo "SIGNED=unsigned" >> "$GITHUB_ENV"
          fi

      - name: Build APK and app bundle
        working-directory: android/${{ matrix.project }}
        # The Gradle projects read MW_OPS_* for whichever key this app uses.
        env:
          MW_OPS_KEYSTORE_PASSWORD: ${{ matrix.key == 'b2b' && secrets.MW_B2B_KEYSTORE_PASSWORD || secrets.MW_OPS_KEYSTORE_PASSWORD }}
          MW_OPS_KEY_ALIAS: ${{ matrix.key == 'b2b' && secrets.MW_B2B_KEY_ALIAS || secrets.MW_OPS_KEY_ALIAS }}
          MW_OPS_KEY_PASSWORD: ${{ matrix.key == 'b2b' && secrets.MW_B2B_KEY_PASSWORD || secrets.MW_OPS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Collect files
        run: |
          mkdir out
          cp android/${{ matrix.project }}/app/build/outputs/apk/release/*.apk "out/${{ matrix.name }}-${SIGNED}.apk"
          cp android/${{ matrix.project }}/app/build/outputs/bundle/release/*.aab "out/${{ matrix.name }}-${SIGNED}.aab"
          rm -f "$RUNNER_TEMP/release-key.p12"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-android
          path: out/

      # Also stored as a tag holding just the built files, so they can be fetched with git.
      - name: Store the files as a tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q
          git add .
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "${{ matrix.title }} Android build ${{ github.run_number }} (${SIGNED}) from ${{ github.sha }}"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "HEAD:refs/tags/android-${{ matrix.name }}-${{ github.run_number }}-files"

      - name: Publish to a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ matrix.name }}-${{ github.run_number }}" out/* \
            --target "${{ github.sha }}" --prerelease \
            --title "${{ matrix.title }} Android build ${{ github.run_number }} (${SIGNED})" \
            --notes "Built from ${{ github.sha }} on ${{ github.ref_name }}."
